<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Felipe</title>
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none; /* Desativa menu de toque no iOS */
      -webkit-user-select: none;   /* Desativa seleção de texto */
      user-select: none;
    }

    body {
      background-color: #D3CECA;
      color: #222222;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 20px 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Top Bar para os botões Liquid Glass */
    .top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      z-index: 10;
    }

    /* Estilo Liquid Glass (Vidro Líquido / Blur) */
    .glass-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111111;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .glass-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.4);
    }

    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .name-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .name {
      font-size: 22px;
      font-weight: 700;
    }

    .verified-badge-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .bio {
      font-size: 15px;
      color: #555555;
      margin-bottom: 24px;
    }

    /* Estilo dos Botões Principais */
    .accordion {
      width: 100%;
      background: linear-gradient(135deg, #1e7e34, #0f401b);
      border: none;
      border-radius: 30px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(15, 64, 27, 0.3);
      transition: transform 0.2s ease;
    }

    .accordion .title {
      flex-grow: 1;
      text-align: center;
    }

    .accordion .arrow {
      font-size: 14px;
      transition: transform 0.3s ease;
    }

    .accordion.active .arrow {
      transform: rotate(180deg);
    }

    /* Container dos Links */
    .links-container {
      width: 100%;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 0px;
    }

    .links-container.open {
      max-height: 800px;
      margin-top: 12px;
    }

    .link-card {
      background: linear-gradient(135deg, #1e7e34, #0f401b);
      border-radius: 30px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(15, 64, 27, 0.2);
      transition: transform 0.1s ease;
      position: relative;
    }

    .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      z-index: 2;
    }

    .link-text {
      flex-grow: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      padding-right: 38px;
      z-index: 2;
    }

    /* Botão Secret Estilizado */
    .secret-card {
      width: 100%;
      margin-top: 12px;
      background: linear-gradient(135deg, #1e7e34, #0f401b);
      border-radius: 30px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(15, 64, 27, 0.3);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
    }

    /* Classe para esconder o botão secret quando o menu abrir */
    .secret-card.hidden {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      height: 0;
      padding: 0;
      margin-top: 0;
    }

    .secret-text {
      font-size: 16px;
      font-weight: 700;
      z-index: 2;
      position: relative;
    }

    /* Fantasminhas aleatórios e tortos no botão Secret */
    .bg-ghost {
      position: absolute;
      color: rgba(255, 255, 255, 0.25);
      font-size: 16px;
      pointer-events: none;
      z-index: 1;
    }

    /* Pop-up Menu (Modal Contact) Liquid Glass */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 90%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 4px;
    }

    .modal-item {
      background: linear-gradient(135deg, #1e7e34, #0f401b);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(15, 64, 27, 0.2);
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      margin-top: 6px;
    }

    /* Notificação Toast ao compartilhar */
    .toast {
      position: fixed;
      bottom: 30px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
    }

    /* Animações de Vibração / Shake */
    .vibrate {
      animation: vibrateAnim 0.3s linear infinite;
    }

    @keyframes vibrateAnim {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-3px, 2px) rotate(-3deg); }
      40% { transform: translate(3px, -2px) rotate(3deg); }
      60% { transform: translate(-2px, -2px) rotate(-2deg); }
      80% { transform: translate(2px, 2px) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .shake-btn {
      animation: shakeBtn 0.4s ease-in-out;
    }

    @keyframes shakeBtn {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-2deg); }
      40% { transform: translateX(6px) rotate(2deg); }
      60% { transform: translateX(-4px) rotate(-1deg); }
      80% { transform: translateX(4px) rotate(1deg); }
    }

    /* Elementos caindo / voando */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 22px;
      user-select: none;
    }

    @keyframes dropGhost {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(180px) scale(0.6) rotate(25deg);
      }
    }

    @keyframes flyDiamond {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar com Botões Liquid Glass -->
  <div class="top-bar">
    <button class="glass-btn" id="msgBtn" aria-label="Enviar Mensagem">
      <i class="fa-regular fa-paper-plane"></i>
    </button>
    <button class="glass-btn" id="shareBtn" aria-label="Compartilhar">
      <i class="fa-solid fa-arrow-up-from-bracket"></i>
    </button>
  </div>

  <div class="profile-container">
    <!-- Foto Perfil -->
    <div class="avatar-wrapper" id="avatarWrapper">
      <img class="avatar" src="IMG_20260908_190605.jpg" alt="Foto de perfil de Felipe">
    </div>

    <div class="name-container">
      <h1 class="name">Felipe</h1>
      <img src="9195920.png" alt="Verificado" class="verified-badge-img">
    </div>

    <p class="bio">Já que entrou aqui, dá uma olhadinha nas minhas outras redes?🙏🏻🙃</p>

    <!-- Botão Principal (Menu Retrátil) -->
    <button class="accordion interactive-btn" id="sociaisBtn">
      <span class="title">sociais</span>
      <i class="fa-solid fa-chevron-down arrow"></i>
    </button>

    <!-- Lista de Redes Sociais -->
    <div class="links-container" id="linksList">
      
      <a href="https://www.facebook.com/share/1EYmLLQw6x/" class="link-card interactive-btn" target="_blank" rel="noopener noreferrer">
        <div class="icon-circle"><i class="fa-brands fa-facebook-f"></i></div>
        <span class="link-text">Facebook</span>
      </a>

      <a href="https://www.tiktok.com/@fel1peofc?_r=1&_t=ZS-99Zf1UrYu7r" class="link-card interactive-btn" target="_blank" rel="noopener noreferrer">
        <div class="icon-circle"><i class="fa-brands fa-tiktok"></i></div>
        <span class="link-text">tiktok</span>
      </a>

      <a href="https://www.instagram.com/ifeliperei?stkn=djZ3cWpmN3RtZ3V5" class="link-card interactive-btn" target="_blank" rel="noopener noreferrer">
        <div class="icon-circle"><i class="fa-brands fa-instagram"></i></div>
        <span class="link-text">Instagram</span>
      </a>

      <a href="https://www.snapchat.com/add/f3lipeoficial?share_id=sZYquIEBCKA&locale=pt-BR" class="link-card interactive-btn" target="_blank" rel="noopener noreferrer">
        <div class="icon-circle"><i class="fa-brands fa-snapchat"></i></div>
        <span class="link-text">Snapchat</span>
      </a>

    </div>

    <!-- Botão Secret com Fantasminhas aleatórios -->
    <a href="https://ngl.link/ifeliperei" class="secret-card" id="secretBtn" target="_blank" rel="noopener noreferrer">
      <i class="fa-solid fa-ghost bg-ghost" style="top: 8px; left: 12px; transform: rotate(-25deg) scale(1.1);"></i>
      <i class="fa-solid fa-ghost bg-ghost" style="bottom: 6px; left: 60px; transform: rotate(15deg) scale(0.8);"></i>
      <i class="fa-solid fa-ghost bg-ghost" style="top: 10px; left: 120px; transform: rotate(-10deg) scale(0.9);"></i>
      <i class="fa-solid fa-ghost bg-ghost" style="bottom: 8px; right: 110px; transform: rotate(20deg) scale(1.2);"></i>
      <i class="fa-solid fa-ghost bg-ghost" style="top: 6px; right: 55px; transform: rotate(-18deg) scale(0.85);"></i>
      <i class="fa-solid fa-ghost bg-ghost" style="bottom: 10px; right: 15px; transform: rotate(12deg) scale(1.05);"></i>

      <span class="secret-text">secret</span>
    </a>

  </div>

  <!-- Modal Pop-up para Mensagens -->
  <div class="modal-overlay" id="contactModal">
    <div class="modal-card">
      <h3 class="modal-title">Enviar mensagem</h3>
      <a href="https://t.me/fe1ipeofc" target="_blank" class="modal-item">
        <i class="fa-brands fa-telegram"></i> Telegram
      </a>
      <a href="mailto:fe1ip3ofc@gmail.com" class="modal-item">
        <i class="fa-regular fa-envelope"></i> E-mail
      </a>
      <button class="modal-close-btn" id="closeModal">Fechar</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">Link copiado para a área de transferência!</div>

  <script>
    // Desativa menu de contexto
    document.addEventListener('contextmenu', e => e.preventDefault());

    const accordionBtn = document.getElementById('sociaisBtn');
    const linksList = document.getElementById('linksList');
    const secretBtn = document.getElementById('secretBtn');
    const avatarWrapper = document.getElementById('avatarWrapper');

    const msgBtn = document.getElementById('msgBtn');
    const shareBtn = document.getElementById('shareBtn');
    const contactModal = document.getElementById('contactModal');
    const closeModal = document.getElementById('closeModal');
    const toast = document.getElementById('toast');

    // Alternar o menu sociais e Ocultar/Mostrar o botão secret
    accordionBtn.addEventListener('click', () => {
      accordionBtn.classList.toggle('active');
      linksList.classList.toggle('open');
      
      // Oculta o secret se as sociais estiverem abertas
      if (linksList.classList.contains('open')) {
        secretBtn.classList.add('hidden');
      } else {
        secretBtn.classList.remove('hidden');
      }
    });

    // Abrir/Fechar Pop-up de Mensagem
    msgBtn.addEventListener('click', () => {
      contactModal.classList.add('active');
    });

    closeModal.addEventListener('click', () => {
      contactModal.classList.remove('active');
    });

    contactModal.addEventListener('click', (e) => {
      if (e.target === contactModal) {
        contactModal.classList.remove('active');
      }
    });

    // Função de Compartilhamento
    shareBtn.addEventListener('click', async () => {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Felipe',
            url: window.location.href
          });
        } catch (err) {}
      } else {
        navigator.clipboard.writeText(window.location.href);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }
    });

    // Animação de Balanço nos botões
    document.querySelectorAll('.interactive-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.add('shake-btn');
        setTimeout(() => btn.classList.remove('shake-btn'), 400);
      });
    });

    function triggerHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate([30, 50, 30]);
      }
    }

    function addLongPress(element, onLongPress) {
      let timer = null;

      const start = (e) => {
        timer = setTimeout(() => {
          triggerHaptic();
          onLongPress(e);
        }, 400);
      };

      const cancel = () => {
        if (timer) clearTimeout(timer);
      };

      element.addEventListener('touchstart', start, { passive: true });
      element.addEventListener('touchend', cancel);
      element.addEventListener('touchmove', cancel);
      element.addEventListener('mousedown', start);
      element.addEventListener('mouseup', cancel);
      element.addEventListener('mouseleave', cancel);
    }

    // 1. Clique Longo na FOTO: Vibra + Chuva de Diamantes 💎
    addLongPress(avatarWrapper, () => {
      avatarWrapper.classList.add('vibrate');
      setTimeout(() => avatarWrapper.classList.remove('vibrate'), 800);

      const rect = avatarWrapper.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 18; i++) {
        const diamond = document.createElement('div');
        diamond.classList.add('particle');
        diamond.innerHTML = '💎';
        diamond.style.left = `${centerX}px`;
        diamond.style.top = `${centerY}px`;

        const dx = (Math.random() - 0.5) * 260;
        const dy = (Math.random() - 0.5) * 260;
        diamond.style.setProperty('--dx', `${dx}px`);
        diamond.style.setProperty('--dy', `${dy}px`);
        diamond.style.animation = 'flyDiamond 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards';

        document.body.appendChild(diamond);
        setTimeout(() => diamond.remove(), 900);
      }
    });

    // 2. Clique Longo no BOTÃO SECRET: Vibra + Fantasmas Escorrendo 👻
    addLongPress(secretBtn, () => {
      secretBtn.classList.add('vibrate');
      setTimeout(() => secretBtn.classList.remove('vibrate'), 800);

      const rect = secretBtn.getBoundingClientRect();

      for (let i = 0; i < 15; i++) {
        const ghost = document.createElement('div');
        ghost.classList.add('particle');
        ghost.innerHTML = '👻';
        
        const randomX = rect.left + Math.random() * rect.width;
        const startY = rect.bottom - 10;
        
        ghost.style.left = `${randomX}px`;
        ghost.style.top = `${startY}px`;
        ghost.style.animation = `dropGhost ${0.8 + Math.random() * 0.4}s ease-in forwards`;

        document.body.appendChild(ghost);
        setTimeout(() => ghost.remove(), 1200);
      }
    });

    // 3. Clique Longo no resto da Página
    addLongPress(document.body, (e) => {
      if (e.target === document.body) {
        document.body.classList.add('vibrate');
        setTimeout(() => document.body.classList.remove('vibrate'), 300);
      }
    });
  </script>

</body>
</html>
