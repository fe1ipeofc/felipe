<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felipe</title>
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #D3CECA;
      color: #222222;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
    }

    .name-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .name {
      font-size: 22px;
      font-weight: 700;
    }

    /* Imagem do selo de verificado personalizada */
    .verified-badge-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .bio {
      font-size: 15px;
      color: #555555;
      margin-bottom: 24px;
    }

    /* Estilo do menu expansível com gradiente verde */
    .accordion {
      width: 100%;
      background: linear-gradient(135deg, #1e7e34, #0f401b);
      border: none;
      border-radius: 30px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(15, 64, 27, 0.3);
      transition: transform 0.2s ease, background 0.3s ease;
    }

    .accordion:active {
      transform: scale(0.98);
    }

    .accordion .title {
      flex-grow: 1;
      text-align: center;
    }

    .accordion .arrow {
      font-size: 14px;
      transition: transform 0.3s ease;
    }

    .accordion.active .arrow {
      transform: rotate(180deg);
    }

    /* Container dos Links das Redes Sociais */
    .links-container {
      width: 100%;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    .links-container.open {
      max-height: 800px;
    }

    /* Estilo dos Cards de Link com gradiente verde */
    .link-card {
      background: linear-gradient(135deg, #1e7e34, #0f401b);
      border-radius: 30px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(15, 64, 27, 0.2);
      transition: transform 0.1s ease;
    }

    .link-card:active {
      transform: scale(0.98);
    }

    /* Estilo para o botão Secret (separado) */
    .standalone-link {
      width: 100%;
      margin-top: 12px;
    }

    .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
    }

    .link-text {
      flex-grow: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      padding-right: 38px;
    }
  </style>
</head>
<body>

  <div class="profile-container">
    <img class="avatar" src="IMG_20260908_190605.jpg" alt="Foto de perfil de Felipe">

    <div class="name-container">
      <h1 class="name">Felipe</h1>
      <!-- Imagem do verificado personalizada -->
      <img src="9195920.png" alt="Verificado" class="verified-badge-img">
    </div>

    <p class="bio">me siga nas redes sociais</p>

    <!-- Botão Principal (Menu Retrátil) -->
    <button class="accordion" id="sociaisBtn">
      <span class="title">sociais</span>
      <i class="fa-solid fa-chevron-down arrow"></i>
    </button>

    <!-- Lista de Redes Sociais -->
    <div class="links-container" id="linksList">
      
      <a href="https://www.facebook.com/share/1EYmLLQw6x/" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="icon-circle"><i class="fa-brands fa-facebook-f"></i></div>
        <span class="link-text">Facebook</span>
      </a>

      <a href="https://www.tiktok.com/@fel1peofc?_r=1&_t=ZS-99Zf1UrYu7r" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="icon-circle"><i class="fa-brands fa-tiktok"></i></div>
        <span class="link-text">tiktok</span>
      </a>

      <a href="https://www.instagram.com/ifeliperei?stkn=djZ3cWpmN3RtZ3V5" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="icon-circle"><i class="fa-brands fa-instagram"></i></div>
        <span class="link-text">Instagram</span>
      </a>

      <a href="https://www.snapchat.com/add/f3lipeoficial?share_id=sZYquIEBCKA&locale=pt-BR" class="link-card" target="_blank" rel="noopener noreferrer">
        <div class="icon-circle"><i class="fa-brands fa-snapchat"></i></div>
        <span class="link-text">Snapchat</span>
      </a>

    </div>

    <!-- Botão Secret (NGL) Separado abaixo do botão "sociais" -->
    <a href="https://ngl.link/ifeliperei" class="link-card standalone-link" target="_blank" rel="noopener noreferrer">
      <div class="icon-circle"><i class="fa-solid fa-ghost"></i></div>
      <span class="link-text">secret</span>
    </a>

  </div>

  <script>
    const accordionBtn = document.getElementById('sociaisBtn');
    const linksList = document.getElementById('linksList');

    accordionBtn.addEventListener('click', () => {
      accordionBtn.classList.toggle('active');
      linksList.classList.toggle('open');
    });
  </script>

</body>
</html>
