<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felipe</title>
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #D3CECA;
      color: #222222;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
    }

    .name-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .name {
      font-size: 22px;
      font-weight: 700;
    }

    /* Ícone de verificado exato */
    .verified-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      vertical-align: middle;
    }

    .bio {
      font-size: 15px;
      color: #555555;
      margin-bottom: 24px;
    }

    /* Estilo do menu expansível */
    .accordion {
      width: 100%;
      background-color: #F3ECE7;
      border: none;
      border-radius: 30px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      color: #111111;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      transition: background-color 0.2s ease;
    }

    .accordion .title {
      flex-grow: 1;
      text-align: center;
    }

    .accordion .arrow {
      font-size: 14px;
      transition: transform 0.3s ease;
    }

    .accordion.active .arrow {
      transform: rotate(180deg);
    }

    /* Container dos Links das Redes Sociais */
    .links-container {
      width: 100%;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    .links-container.open {
      max-height: 800px;
    }

    .link-card {
      background-color: #F3ECE7;
      border-radius: 30px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #111111;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      transition: transform 0.1s ease;
    }

    .link-card:active {
      transform: scale(0.98);
    }

    .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }

    .link-text {
      flex-grow: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      padding-right: 38px;
    }
  </style>
</head>
<body>

  <div class="profile-container">
    <img class="avatar" src="IMG_20260908_190605.jpg" alt="Foto de perfil de Felipe">

    <div class="name-container">
      <h1 class="name">Felipe</h1>
      <!-- Selo exato de verificação -->
      <svg class="verified-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.5 12.5C22.5 11.24 21.6 10.2 20.65 9.87C21.05 8.68 20.68 7.32 19.7 6.34C18.72 5.36 17.36 4.99 16.17 5.39C15.84 4.44 14.8 3.5 13.5 3.5C12.2 3.5 11.16 4.44 10.83 5.39C9.64 4.99 8.28 5.36 7.3 6.34C6.32 7.32 5.95 8.68 6.35 9.87C5.4 10.2 4.5 11.24 4.5 12.5C4.5 13.76 5.4 14.8 6.35 15.13C5.95 16.32 6.32 17.68 7.3 18.66C8.28 19.64 9.64 20.01 10.83 19.61C11.16 20.56 12.2 21.5 13.5 21.5C14.8 21.5 15.84 20.56 16.17 19.61C17.36 20.01 18.72 19.64 19.7 18.66C20.68 17.68 21.05 16.32 20.65 15.13C21.6 14.8 22.5 13.76 22.5 12.5Z" fill="#1D9BF0"/>
        <path d="M10.2 15.5L7.2 12.5L8.6 11.1L10.2 12.7L15.4 7.5L16.8 8.9L10.2 15.5Z" fill="white"/>
      </svg>
    </div>

    <p class="bio">me siga nas redes sociais</p>

    <!-- Botão Principal (Menu Retrátil) -->
    <button class="accordion" id="sociaisBtn">
      <span class="title">sociais</span>
      <i class="fa-solid fa-chevron-down arrow"></i>
    </button>

    <!-- Lista de Redes Sociais -->
    <div class="links-container" id="linksList">
      
      <a href="#" class="link-card" target="_blank">
        <div class="icon-circle"><i class="fa-brands fa-facebook-f"></i></div>
        <span class="link-text">Facebook</span>
      </a>

      <a href="#" class="link-card" target="_blank">
        <div class="icon-circle"><i class="fa-brands fa-tiktok"></i></div>
        <span class="link-text">tiktok</span>
      </a>

      <a href="#" class="link-card" target="_blank">
        <div class="icon-circle"><i class="fa-brands fa-instagram"></i></div>
        <span class="link-text">Instagram</span>
      </a>

      <a href="#" class="link-card" target="_blank">
        <div class="icon-circle"><i class="fa-brands fa-snapchat"></i></div>
        <span class="link-text">Snapchat</span>
      </a>

      <a href="#" class="link-card" target="_blank">
        <div class="icon-circle"><i class="fa-brands fa-threads"></i></div>
        <span class="link-text">tópicos</span>
      </a>

      <a href="#" class="link-card" target="_blank">
        <div class="icon-circle" style="font-size: 11px;">NGL</div>
        <span class="link-text">NGL</span>
      </a>

    </div>
  </div>

  <script>
    const accordionBtn = document.getElementById('sociaisBtn');
    const linksList = document.getElementById('linksList');

    accordionBtn.addEventListener('click', () => {
      accordionBtn.classList.toggle('active');
      linksList.classList.toggle('open');
    });
  </script>

</body>
</html>
